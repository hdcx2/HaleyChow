name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Sync FinIQ preview from its source repository
        id: sync
        run: |
          source_dir="$(mktemp -d)"
          git clone --quiet --depth 1 https://github.com/hdcx2/FinIQ.git "$source_dir/FinIQ"
          rsync -a --delete "$source_dir/FinIQ/FinIQ/" assets/previews/finiq/
          if [[ -n "$(git status --porcelain -- assets/previews/finiq)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/previews/finiq
            git commit -m "Sync FinIQ preview from source repository"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site files
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
